<style>
/* Layout: a printer's type case. The board is a tray of lead-type sorts on dark walnut; the side panel is a proof sheet. */
:root{
  --wood:#2a1d15;      /* walnut case */
  --wood-2:#3a2a1f;    /* raised wood */
  --groove:#1a120c;    /* tray recess */
  --sort:#e9dfc9;      /* type-sort face */
  --sort-edge:#b9a888; /* sort shoulder */
  --ink:#1b1a1f;       /* printer's ink */
  --paper:#f3ecdc;     /* proof paper */
  --brass:#c9a24a;     /* brass fittings / accent */
  --rubric:#b23a2b;    /* rubrication red */
  --ok:#5b8f4e;
  --muted:#a8957a;
  --f-display:"Grenze Gotisch","UnifrakturMaguntia",Georgia,serif;
  --f-sort:"Zilla Slab",Rockwell,"Courier New",serif;
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",Tahoma,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;background:var(--wood);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:repeating-linear-gradient(92deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px),repeating-linear-gradient(88deg,rgba(0,0,0,.08) 0 1px,transparent 1px 23px);
}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6vw,52px);line-height:1;margin:0;color:var(--paper);letter-spacing:.01em}
h1 .s{color:var(--rubric)}
.tag{color:var(--muted);font-size:14px}
.game{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.game{grid-template-columns:minmax(0,1fr)}}

/* stats bar */
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat{flex:1 1 0;background:var(--groove);border:1px solid #4a3828;border-radius:6px;padding:6px 10px;min-width:0}
.stat b{display:block;font-family:var(--f-sort);font-size:22px;line-height:1.1;color:var(--paper);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.lives{color:var(--rubric);letter-spacing:2px}
.lives .gone{color:#4a3828}
.progress{height:6px;background:var(--groove);border-radius:3px;overflow:hidden;margin:-4px 0 12px}
.progress i{display:block;height:100%;background:var(--brass);width:0;transition:width .4s}

/* board */
.tray{background:var(--groove);padding:10px;border-radius:10px;border:2px solid #4a3828;box-shadow:inset 0 2px 10px rgba(0,0,0,.6);width:fit-content;max-width:100%}
.board{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.tile{position:absolute;display:grid;place-items:center;border-radius:5px;cursor:pointer;
  background:linear-gradient(180deg,var(--sort) 0%,#ddd0b3 100%);color:var(--ink);
  box-shadow:0 3px 0 var(--sort-edge),0 5px 6px rgba(0,0,0,.45);
  font-family:var(--f-sort);font-weight:700;transition:top .32s cubic-bezier(.3,1.25,.6,1),transform .12s,background .15s;}
.tile .l{font-size:calc(var(--ts)*.5);line-height:1}
.tile.ch .l{font-size:calc(var(--ts)*.38)}
.tile .v{position:absolute;right:5px;bottom:2px;font-size:calc(var(--ts)*.2);opacity:.6;font-variant-numeric:tabular-nums}
.tile.sel{transform:translateY(2px);background:linear-gradient(180deg,#f6d983,var(--brass));box-shadow:0 1px 0 #8e6f2a,0 2px 3px rgba(0,0,0,.4)}
.tile.sel.last{outline:3px solid var(--paper);outline-offset:1px}
.tile.red{background:linear-gradient(180deg,#e7a597,#c9634f);color:#2a0d08}
.tile.gold{background:linear-gradient(180deg,#ffe9a6,#d9a930);color:#3a2604}
.tile.red::before,.tile.gold::before{content:attr(data-b);position:absolute;left:5px;top:2px;font-size:calc(var(--ts)*.2);font-family:var(--f-body);font-weight:600}
.tile.ink{background:radial-gradient(circle at 40% 35%,#4a4650,var(--ink) 70%);color:var(--paper);box-shadow:0 3px 0 #000,0 5px 6px rgba(0,0,0,.45)}
.tile.ink .cd{position:absolute;left:4px;top:2px;font-size:calc(var(--ts)*.22);color:#ff8f7a;font-family:var(--f-body);font-weight:600}
.tile.ink.danger{animation:throb .9s infinite}
.tile.sel.ink{background:linear-gradient(180deg,#f6d983,var(--brass));color:var(--ink)}
.tile.hint{animation:hint 1s 2}
.tile.heal{background:linear-gradient(180deg,#cfe6b8,#86b56a);color:#132a0c}
.tile.heal::before{content:attr(data-h);position:absolute;left:4px;top:2px;font-size:calc(var(--ts)*.2);font-family:var(--f-body);font-weight:600;color:#1d4a12}
.tile:focus-visible{outline:3px solid var(--brass)}
@keyframes throb{50%{box-shadow:0 3px 0 #000,0 0 14px 3px rgba(255,90,60,.6)}}
@keyframes hint{50%{transform:translateY(-6px);box-shadow:0 0 0 3px var(--brass),0 8px 10px rgba(0,0,0,.4)}}
.pop{position:absolute;pointer-events:none;font-family:var(--f-sort);font-weight:700;font-size:26px;color:var(--brass);text-shadow:0 2px 0 #000;animation:pop 1s forwards;z-index:5}
@keyframes pop{to{transform:translateY(-50px);opacity:0}}

/* composing stick */
.stick{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.word{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--wood-2);border:1px solid #4a3828;border-radius:8px;padding:6px 14px}
.word .w{font-family:var(--f-sort);font-weight:700;font-size:28px;letter-spacing:.08em;color:var(--muted);overflow-wrap:anywhere;min-width:0}
.word.valid .w{color:var(--paper)}
.word .pts{font-family:var(--f-sort);font-size:18px;color:var(--brass);white-space:nowrap;font-variant-numeric:tabular-nums}
.word .hintmsg{font-size:13px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:var(--f-body);font-size:15px;font-weight:600;border-radius:7px;border:1px solid #5a4632;background:var(--wood-2);color:var(--paper);padding:9px 14px;cursor:pointer;min-height:44px}
button:hover{border-color:var(--brass)}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
button:disabled{opacity:.4;cursor:default;border-color:#5a4632}
button.primary{background:var(--brass);color:var(--ink);border-color:var(--brass);flex:1 1 140px}
button.primary:disabled{background:#5a4a2c;color:#2a1d15}
button small{font-weight:400;opacity:.75}

/* proof sheet */
.proof{background:var(--paper);color:var(--ink);border-radius:4px;padding:18px 20px 20px;box-shadow:0 10px 30px rgba(0,0,0,.45);min-width:0;
  background-image:linear-gradient(transparent 31px,rgba(27,26,31,.07) 32px);background-size:100% 32px}
.proof h2{font-family:var(--f-display);font-weight:600;font-size:28px;margin:0 0 2px;line-height:1.1}
.proof .sub{font-size:13px;color:#6d6252;margin:0 0 12px}
.recent{border:1.5px solid var(--ink);border-radius:4px;padding:10px 12px;margin-bottom:14px;background:rgba(255,255,255,.4)}
.recent .de{font-family:var(--f-sort);font-size:24px;font-weight:700;line-height:1.2}
.recent .art{color:var(--rubric)}
.recent .th{font-size:17px}
.recent .no{font-size:13px;color:#6d6252}
.recent .form{font-size:12px;color:#6d6252;letter-spacing:.03em}
.log .fm{font-weight:600;color:#6d6252;font-size:14px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.langs{display:inline-flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.langs button{min-height:34px;padding:4px 12px;border:0;border-radius:0;background:transparent;color:var(--ink);font-size:14px}
.langs button+button{border-left:1.5px solid var(--ink)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.langs button:hover{background:rgba(27,26,31,.1)}
.langs button[aria-pressed="true"]:hover{background:var(--ink)}
.recent a,.log a{color:var(--rubric)}
.log{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto}
.log li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:6px 0;border-bottom:1px dashed rgba(27,26,31,.2)}
.log .de{font-family:var(--f-sort);font-weight:700;font-size:17px;overflow-wrap:anywhere}
.log .p{font-family:var(--f-sort);color:#6d6252;font-variant-numeric:tabular-nums}
.log .th{grid-column:1/-1;font-size:14px;color:#3d372f}
.empty{font-size:14px;color:#6d6252}
.rules{margin-top:16px;font-size:13.5px;color:#3d372f}
.rules summary{cursor:pointer;font-weight:600;color:var(--ink)}
.rules ul{padding-left:18px;margin:8px 0 0}
.rules li{margin:3px 0}
.chip{display:inline-block;padding:0 6px;border-radius:3px;font-family:var(--f-sort);font-weight:700;font-size:12px}
.chip.h{background:#86b56a;color:#132a0c}.chip.r{background:#c9634f;color:#2a0d08}.chip.g{background:#d9a930;color:#3a2604}.chip.k{background:var(--ink);color:var(--paper)}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(15,10,6,.78);display:grid;place-items:center;z-index:20;padding:16px}
.card{background:var(--paper);color:var(--ink);border-radius:6px;padding:24px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.card h3{font-family:var(--f-display);font-size:34px;margin:0 0 6px;line-height:1.1}
.card p{margin:6px 0}
.card .big{font-family:var(--f-sort);font-size:40px;font-weight:700;color:var(--rubric)}
.card button{margin-top:14px;width:100%;background:var(--ink);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);border:1px solid var(--brass);padding:10px 16px;border-radius:8px;z-index:30;max-width:calc(100% - 32px);text-align:center;font-size:14px}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile.hint,.tile.ink.danger,.pop{animation:none}}
</style>
<style>
/* ---- battle stage ---- */
.stage{position:relative;height:178px;margin-bottom:12px;border-radius:10px;overflow:hidden;border:2px solid #4a3828;
  background:radial-gradient(120% 90% at 50% 0%,#4a3626 0%,#2a1d15 60%,#1a120c 100%)}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,#3a2a1f,#24180f);border-top:2px solid #5a4632}
.side{position:absolute;bottom:20px;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:2;width:42%}
.side.me{left:2%}.side.enemy{right:2%}
.side .bars{width:100%;max-width:190px;display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.side .nm{font-size:12.5px;line-height:1.2;color:var(--paper);text-align:center;overflow-wrap:anywhere}
.side .nm b{font-family:var(--f-display);font-weight:600;font-size:18px;display:block;line-height:1}
.hpbar{height:9px;background:#120c08;border-radius:5px;overflow:hidden;border:1px solid #5a4632}
.hpbar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .35s}
.hpbar.enemy i{background:var(--rubric)}
.hpt{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.hpt b{color:var(--paper);font-weight:600}
.atk{color:#ff8f7a}
.sprite{width:88px;height:88px;position:relative;z-index:3}
.sprite svg{width:100%;height:100%;overflow:visible;display:block}
.idle{animation:idle 2.4s ease-in-out infinite}
.side.enemy .idle{animation-duration:1.9s}
@keyframes idle{50%{transform:translateY(-4px)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:6}
.proj{position:absolute;width:26px;height:26px;border-radius:4px;display:grid;place-items:center;font-family:var(--f-sort);font-weight:700;font-size:16px;
  background:linear-gradient(180deg,#f6d983,var(--brass));color:var(--ink);box-shadow:0 0 10px rgba(255,210,122,.8)}
.proj.crit{background:linear-gradient(180deg,#ffe9a6,#e3742f);box-shadow:0 0 16px rgba(255,120,60,.95)}
.inkball{position:absolute;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5b5670,#121016 70%);box-shadow:0 0 12px rgba(0,0,0,.8)}
.spark{position:absolute;width:8px;height:8px;border-radius:2px}
.dmg{position:absolute;font-family:var(--f-sort);font-weight:700;font-size:26px;color:#ffd27a;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.6);white-space:nowrap;transform:translateX(-50%)}
.dmg.heal{color:#a8e08a}.dmg.hurt{color:#ff8f7a}.dmg.crit{font-size:32px;color:#ffb35a}
.shake{animation:shake .45s}
@keyframes shake{15%{transform:translate(-7px,2px)}35%{transform:translate(6px,-2px)}55%{transform:translate(-5px,1px)}75%{transform:translate(4px,0)}}
.splat{position:absolute;inset:0;pointer-events:none;z-index:8;border-radius:10px;
  background:radial-gradient(circle at 30% 40%,rgba(18,16,22,.55) 0 8%,transparent 9%),radial-gradient(circle at 70% 65%,rgba(18,16,22,.5) 0 6%,transparent 7%),radial-gradient(circle at 55% 25%,rgba(18,16,22,.45) 0 4%,transparent 5%),radial-gradient(circle at 20% 75%,rgba(18,16,22,.45) 0 5%,transparent 6%)}
.modes{display:grid;gap:10px;margin-top:12px}
.card .modes button{width:100%;margin:0;text-align:left;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:10px 14px;display:block}
.card .modes button b{display:block;font-family:var(--f-display);font-size:22px;font-weight:600}
.card .modes button span{font-size:13.5px;font-weight:400;color:#3d372f}
.card .modes button:hover{background:#fff8e6}
.uil{display:flex;justify-content:center;margin-top:8px}
.card .langs button{width:auto;margin:0;background:transparent;color:var(--ink)}
.card .langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.modebtn{min-height:36px;padding:5px 12px;font-size:13px}
.confirm-row{display:flex;gap:8px;margin-top:14px}
.card .confirm-row button{margin:0;flex:1}
.card .confirm-row button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.skip{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:14px;cursor:pointer}
.skip input{width:18px;height:18px;accent-color:var(--rubric)}
.warn{color:var(--rubric);font-weight:600}
.utr{font-size:12px;color:#6d6252;font-style:italic}
.addtr{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.addtr input{flex:1 1 160px;min-width:0;font:inherit;font-size:15px;padding:7px 10px;border:1.5px solid var(--ink);border-radius:6px;background:#fffdf6;color:var(--ink)}
.proof .lnk{background:transparent;border:1.5px dashed var(--rubric);color:var(--rubric);min-height:34px;padding:4px 10px;font-size:13.5px;margin-top:6px}
.proof .lnk:hover{background:rgba(178,58,43,.07)}
.proof .lnk.sm{border-style:solid;border-color:transparent;padding:2px 6px;min-height:28px;margin:0;font-size:12.5px;text-decoration:underline}
.proof .save{background:var(--ink);color:var(--paper);border-color:var(--ink);min-height:38px;padding:6px 14px}
.proof .cancel{background:transparent;color:var(--ink);border:1.5px solid var(--ink);min-height:38px;padding:6px 12px}
@media (max-width:420px){.sprite{width:68px;height:68px}.stage{height:206px}.side{width:46%}.side .nm b{font-size:16px}}
@media (prefers-reduced-motion:reduce){.idle,.shake{animation:none}}
</style>

<div class="wrap">
  <header>
    <h1>Setz<span class="s">k</span>asten</h1>

<script>
(function(){
const COLS=7,ROWS=7;
const DICT=new Set(WORDS.split(' '));
const TRIE={};
for(const w of DICT){let n=TRIE;for(const c of w){n=n[c]||(n[c]={});}n.$=1;}
const VAL={e:1,n:1,s:1,i:1,r:1,t:1,u:1,a:1,d:1,h:2,g:2,l:2,o:2,m:3,b:3,w:3,z:3,c:4,f:4,k:4,p:4,ch:4,'ä':6,j:6,'ü':6,v:6,'ö':8,x:8,q:10,y:10};
// German letter frequencies (per mille); C mostly lives inside the CH sort
const FREQ={e:150,n:90,i:72,s:68,r:66,a:64,t:58,d:46,h:36,u:40,l:34,g:28,o:30,m:25,b:19,w:17,f:16,k:14,z:11,p:9,v:7,ch:22,c:3,'ü':6,'ä':5,'ö':4,j:3,y:1,x:1,q:1};
const VOW=new Set(['a','e','i','o','u','ä','ö','ü']);
const LMULT=[0,0,0,1,1.25,1.5,2,2.5,3,3.5,4,4.5,5];
const HINT_HP=3,HINT_PTS=50;
let pool=[];for(const k in FREQ)for(let i=0;i<FREQ[k];i++)pool.push(k);

// ---------- storage ----------

function spawnFoe(){
  const k=(chap-1)%FOES.length,st=foeStats(chap);
  foe={...FOES[k],k,lap:Math.floor((chap-1)/FOES.length),hp:st.hp,max:st.hp,atk:st.atk,every:st.every,cd:st.every};

function tsize(){const w=Math.min(window.innerWidth-56,470);return Math.floor((w-(COLS-1)*6)/COLS);}
let TS=tsize(),GAP=6;
function layout(){TS=tsize();boardEl.style.setProperty('--ts',TS+'px');boardEl.style.width=(COLS*TS+(COLS-1)*GAP)+'px';boardEl.style.height=(ROWS*TS+(ROWS-1)*GAP)+'px';
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){const tl=grid[c][r];if(tl)place(tl,c,r);}}
function target(){return 1000+(chap-1)*500}
function randLetter(){
  let vc=0,n=0;for(const col of grid||[])for(const tl of col)if(tl){n++;if(VOW.has(tl.l))vc++;}
  if(n>10&&vc/n<0.3&&Math.random()<0.6){const v=['e','e','e','a','i','u','o','e','a','i'];return v[Math.random()*v.length|0];}
  if(n>10&&vc/n>0.5&&Math.random()<0.5){const v=['n','s','r','t','d','h','l','g'];return v[Math.random()*v.length|0];}
  return pool[Math.random()*pool.length|0];
}
function mkTile(l){const tl={id:++uid,l:l||randLetter(),bonus:0,ink:0,heal:0,el:document.createElement('div')};tl.el.className='tile';tl.el.tabIndex=0;tl.el.dataset.id=tl.id;boardEl.appendChild(tl.el);paint(tl);return tl;}
function paint(tl){
  const L=tl.l==='ch'?'CH':tl.l.toUpperCase();
  tl.el.className='tile'+(tl.l==='ch'?' ch':'')+(tl.heal?' heal':'')+(tl.bonus===2?' red':'')+(tl.bonus===3?' gold':'')+(tl.ink?' ink':'')+(tl.ink&&tl.ink<=2?' danger':'');
  tl.el.dataset.b=tl.bonus?'×'+tl.bonus:'';tl.el.dataset.h=tl.heal?'+'+tl.heal:'';
  tl.el.innerHTML=(tl.ink?'<span class="cd">'+tl.ink+'</span>':'')+'<span class="l">'+L+'</span><span class="v">'+VAL[tl.l]+'</span>';
  tl.el.setAttribute('aria-label',L+(tl.ink?' ink '+tl.ink:'')+(tl.bonus?' ×'+tl.bonus:'')+(tl.heal?' +'+tl.heal+' HP':''));
}
function decorate(tl){
  if(!battle()||tl.bonus||tl.heal)return;const r=Math.random();
  if(r<0.07)tl.heal=6+chap;else if(r<0.105)tl.bonus=2;else return;paint(tl);
}
function place(tl,c,r){tl.c=c;tl.r=r;tl.el.style.width=tl.el.style.height=TS+'px';tl.el.style.left=c*(TS+GAP)+'px';tl.el.style.top=r*(TS+GAP)+'px';}

function newGame(m){
  if(m)mode=m;sset('setzkasten-mode',mode);loadBest();
  boardEl.innerHTML='';uid=0;grid=null;sel=[];score=0;chap=1;chapScore=0;lives=3;found=[];moves=0;busy=false;
  php=pmax=100;foe=null;$('fx').innerHTML='';
  if(battle())spawnFoe();
  $('stage').hidden=!battle();$('progbox').hidden=battle();$('livesbox').hidden=battle();
  grid=Array.from({length:COLS},()=>Array(ROWS).fill(null));
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){const tl=mkTile();grid[c][r]=tl;decorate(tl);}
  layout();ensurePlayable();
  $('over').hidden=true;applyLang();
}

function wordOf(s){return s.map(x=>x.l).join('');}
function adj(a,b){return a!==b&&Math.abs(a.c-b.c)<=1&&Math.abs(a.r-b.r)<=1;}
function calc(s){
  const w=wordOf(s);let base=0,mult=1;for(const x of s){base+=VAL[x.l];if(x.bonus)mult*=x.bonus;}
  const len=Math.min(w.length,12);const inkB=s.filter(x=>x.ink).length;
  return Math.round(base*LMULT[len]*mult*10)+inkB*50;
}
function dmgOf(p){return Math.max(1,Math.round(p/10));}
function updateWord(){
  const w=wordOf(sel),ok=w.length>=3&&DICT.has(w);
  $('word').textContent=sel.length?w.toUpperCase():t('tap');
  $('wordbox').classList.toggle('valid',ok);
  if(ok&&battle()){const h=sel.reduce((a,x)=>a+x.heal,0);$('pts').textContent='⚔ '+dmgOf(calc(sel))+(h?' · +'+h+' HP':'');}
  else $('pts').textContent=ok?'+'+calc(sel):(w.length>=3?t('notword'):'');
  $('submit').disabled=!ok||busy;
  for(const col of grid)for(const x of col)if(x){x.el.classList.toggle('sel',sel.includes(x));x.el.classList.toggle('last',x===sel[sel.length-1]);}
}
function updateUI(){
  $('score').textContent=score;$('chap').textContent=chap;$('best').textContent=Math.max(best,score);
  $('lives').innerHTML='✒'.repeat(lives)+'<span class="gone">'+'✒'.repeat(3-lives)+'</span>';
  $('hintcost').textContent=battle()?'(−'+HINT_HP+' HP)':'(−'+HINT_PTS+')';
  $('prog').style.width=Math.min(100,chapScore/target()*100)+'%';
  if(battle()&&foe){
    $('chapinfo').textContent=t('stageInfo',{c:chap,n:foeName()+' ('+foeSub()+')'});
    $('php').style.width=(php/pmax*100)+'%';$('phpt').textContent=php+' / '+pmax;
    $('php').style.background=php/pmax<0.3?'var(--rubric)':php/pmax<0.6?'var(--brass)':'';
    $('fname').innerHTML='<b>'+foeName()+'</b>'+esc(foeSub());
    $('fhp').style.width=(foe.hp/foe.max*100)+'%';$('fhpt').textContent=foe.hp+' / '+foe.max;
    $('fatk').textContent=foe.cd<=1?t('atkNext',{a:foe.atk}):t('atkIn',{n:foe.cd,a:foe.atk});
  } else $('chapinfo').textContent=t('chapInfo',{c:chap,s:chapScore,t:target()});
  updateWord();
}
function applyLang(){
  document.documentElement.lang=lang;
  for(const el of document.querySelectorAll('[data-i]'))el.textContent=t(el.dataset.i);
  $('chaplbl').textContent=battle()?t('stage'):t('chapter');
  $('modename').textContent=battle()?t('tagB'):t('tagC');
  $('ruleslist').innerHTML=t('rules').map(r=>'<li>'+r+'</li>').join('');
  for(const b of document.querySelectorAll('#dictlangs button'))b.setAttribute('aria-pressed',b.dataset.l===lang);
  updateUI();renderDict();
}
function setLang(l){if(!I18N[l])return;lang=l;sset('setzkasten-lang',l);applyLang();}

// ---------- input ----------
let drag=null;
function tileAt(x,y,strict){
  const rb=boardEl.getBoundingClientRect();const fx=(x-rb.left)/(TS+GAP),fy=(y-rb.top)/(TS+GAP);
  const c=Math.floor(fx),r=Math.floor(fy);if(c<0||r<0||c>=COLS||r>=ROWS)return null;
  if(strict){const dx=fx-c-TS/(TS+GAP)/2,dy=fy-r-TS/(TS+GAP)/2;if(Math.hypot(dx,dy)>0.4)return null;}
  return grid[c][r];
}
function tapTile(x){
  const i=sel.indexOf(x);
  if(i>=0){sel=sel.slice(0,i+(i===sel.length-1?0:1));}
  else if(!sel.length||adj(sel[sel.length-1],x))sel.push(x);
  else sel=[x];
  updateWord();
}
boardEl.addEventListener('pointerdown',e=>{
  if(busy)return;const x=tileAt(e.clientX,e.clientY,false);if(!x)return;
  e.preventDefault();boardEl.setPointerCapture(e.pointerId);
  drag={moved:false,start:x,wasLast:x===sel[sel.length-1]};
  if(!sel.includes(x)){if(!sel.length||adj(sel[sel.length-1],x))sel.push(x);else sel=[x];drag.added=true;}
  updateWord();
});
boardEl.addEventListener('pointermove',e=>{
  if(!drag)return;const x=tileAt(e.clientX,e.clientY,true);if(!x)return;
  const last=sel[sel.length-1];if(x===last)return;
  if(sel.length>1&&x===sel[sel.length-2]){sel.pop();drag.moved=true;updateWord();return;}
  if(!sel.includes(x)&&adj(last,x)){sel.push(x);drag.moved=true;updateWord();}
});
function endDrag(){
  if(!drag)return;const d=drag;drag=null;
  if(d.moved){const w=wordOf(sel);if(w.length>=3&&DICT.has(w))submit();return;}
  if(!d.added){const i=sel.indexOf(d.start);if(d.wasLast)sel.pop();else if(i>=0)sel=sel.slice(0,i+1);updateWord();}
}
boardEl.addEventListener('pointerup',endDrag);boardEl.addEventListener('pointercancel',endDrag);
boardEl.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const x=findById(e.target.dataset.id);if(x){e.preventDefault();tapTile(x);}}});
function findById(id){for(const col of grid)for(const x of col)if(x&&x.id==id)return x;}
document.addEventListener('keydown',e=>{
  if(!$('over').hidden||e.target.tagName==='INPUT')return;
  if(e.key==='Enter'&&e.target===document.body&&!$('submit').disabled){submit();}
  else if(e.key==='Escape'){sel=[];updateWord();}
  else if(e.key==='Backspace'){sel.pop();updateWord();}
});
$('submit').onclick=submit;
$('clear').onclick=()=>{sel=[];updateWord();};
$('hint').onclick=()=>{
  if(busy)return;
  if(battle()&&php<=HINT_HP){toast(t('hintLow'));return;}
  if(!battle()&&score<HINT_PTS){toast(t('hintPts'));return;}
  confirmStep('hint',t('cfHintT'),'<p>'+(battle()?t('cfHintB',{n:HINT_HP}):t('cfHintC',{n:HINT_PTS}))+'</p>',doHint);
};
function doHint(){
  const path=findWord(5);if(!path){toast(t('noWords'));shuffle(false);return;}
  if(battle()){php=Math.max(1,php-HINT_HP);floatText(sideAnchor('me'),'−'+HINT_HP,'hurt');}else score=Math.max(0,score-HINT_PTS);
  sel=[];updateUI();
  for(const x of path){x.el.classList.remove('hint');void x.el.offsetWidth;x.el.classList.add('hint');}
  toast(t('hintToast',{l:path[0].l.toUpperCase(),n:path.length}));
}
$('shuffle').onclick=()=>{
  if(busy)return;
  const warn=battle()&&foe&&foe.cd<=1?'<p class="warn">'+t('cfShuffleWarn',{a:foe.atk})+'</p>':'';
  confirmStep('shuffle',t('cfShuffleT'),'<p>'+(battle()?t('cfShuffleB'):t('cfShuffleC'))+'</p>'+warn,()=>shuffle(true));
};
$('modebtn').onclick=()=>pickMode(true);
for(const b of document.querySelectorAll('#dictlangs button'))b.onclick=()=>setLang(b.dataset.l);

// ---------- dialogs ----------
function showOver(title,body,btn,fn){
  $('ovt').textContent=title;$('ovb').innerHTML=body;$('again').hidden=!btn;
  if(btn){$('again').textContent=btn;$('again').onclick=fn;}
  $('over').hidden=false;(btn?$('again'):$('ovb').querySelector('button'))?.focus();
}
function closeOver(){$('over').hidden=true;}
function confirmStep(key,title,body,fn){
  if(sget('setzkasten-skip-'+key,'')==='1'){fn();return;}
  showOver(title,body+'<label class="skip"><input type="checkbox" id="skipbox"> '+t('dontAsk')+'</label><div class="confirm-row"><button class="alt" id="cfno">'+t('cancel')+'</button><button id="cfyes">'+t('confirm')+'</button></div>',null,null);
  $('cfno').onclick=closeOver;
  $('cfyes').onclick=()=>{if($('skipbox').checked)sset('setzkasten-skip-'+key,'1');closeOver();fn();};
  $('cfyes').focus();
}
function pickMode(cancelable){
  const L=[['th','ไทย'],['en','English'],['nl','Nederlands']];
  showOver(t('pickT'),'<p>'+t('pickB')+'</p><div class="uil"><div class="langs" role="group">'+L.map(([k,n])=>'<button data-ul="'+k+'" aria-pressed="'+(k===lang)+'">'+n+'</button>').join('')+'</div></div>'+
    '<div class="modes"><button data-m="classic"><b>Klassisch</b><span>'+t('modeC')+'</span></button><button data-m="battle"><b>Kampf</b><span>'+t('modeB')+'</span></button>'+(cancelable?'<button data-m=""><span>'+t('back')+'</span></button>':'')+'</div>',null,null);
  for(const b of $('ovb').querySelectorAll('[data-ul]'))b.onclick=()=>{setLang(b.dataset.ul);pickMode(cancelable);$('ovb').querySelector('[data-ul="'+b.dataset.ul+'"]').focus();};
  for(const b of $('ovb').querySelectorAll('.modes button'))b.onclick=()=>{if(b.dataset.m)newGame(b.dataset.m);else closeOver();};
}

// ---------- battle effects ----------
const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function stageRect(){return $('stage').getBoundingClientRect();}
function sideAnchor(id){const r=$(id==='me'?'mesprite':'foesprite').getBoundingClientRect(),s=stageRect();return{x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2};}
function floatText(p,txt,cls){
  const el=document.createElement('div');el.className='dmg '+(cls||'');el.textContent=txt;el.style.left=p.x+'px';el.style.top=(p.y-40)+'px';$('fx').appendChild(el);
  el.animate([{transform:'translate(-50%,10px) scale(.6)',opacity:0},{transform:'translate(-50%,-6px) scale(1.15)',opacity:1,offset:.25},{transform:'translate(-50%,-40px) scale(1)',opacity:0}],{duration:1100,easing:'ease-out'}).onfinish=()=>el.remove();
}
function burst(p,colors,n){
  if(reduced)return;
  for(let i=0;i<n;i++){
    const s=document.createElement('div');s.className='spark';s.style.background=colors[i%colors.length];s.style.left=p.x+'px';s.style.top=p.y+'px';$('fx').appendChild(s);
    const a=Math.random()*Math.PI*2,d=30+Math.random()*45;
    s.animate([{transform:'translate(-50%,-50%) rotate(0)',opacity:1},{transform:'translate('+(Math.cos(a)*d-4)+'px,'+(Math.sin(a)*d-4)+'px) rotate('+(Math.random()*360)+'deg) scale(.4)',opacity:0}],{duration:500+Math.random()*300,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>s.remove();
  }
}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
function anim(el,frames,opt){if(reduced)return Promise.resolve();return el.animate(frames,opt).finished.catch(()=>{});}
async function playerAttack(word,dmg,crit,heal){
  const me=$('mesprite'),fo=$('foesprite'),a=sideAnchor('me'),b=sideAnchor('foe');
  if(heal){burst(a,['#a8e08a','#e9f7d9','#6fbf4f'],14);floatText({x:a.x,y:a.y-14},'+'+heal+' HP','heal');}
  anim(me,[{transform:'none'},{transform:'translateX(18px) rotate(6deg)'},{transform:'none'}],{duration:350});
  const letters=word.toUpperCase().replace('CH','\u0001').split('').map(c=>c==='\u0001'?'CH':c).slice(0,8);
  const flights=letters.map((L,i)=>{
    const p=document.createElement('div');p.className='proj'+(crit?' crit':'');p.textContent=L;$('fx').appendChild(p);
    const y0=a.y-10+(i%3-1)*8,dy=b.y-y0;
    return wait(i*55).then(()=>anim(p,[{transform:'translate('+(a.x-13)+'px,'+(y0-13)+'px) scale(.6)',opacity:0},{transform:'translate('+((a.x+b.x)/2-13)+'px,'+(y0+dy/2-60-13)+'px) rotate(180deg) scale(1)',opacity:1,offset:.5},{transform:'translate('+(b.x-13)+'px,'+(b.y-13)+'px) rotate(360deg) scale(.8)',opacity:1}],{duration:reduced?1:420,easing:'cubic-bezier(.3,.1,.5,1)'})).then(()=>p.remove());
  });
  await Promise.all(flights);
  burst(b,crit?['#ffb35a','#ffe9a6','#e3742f','#fff']:['#ffd27a','#f3ecdc','#c9a24a'],crit?26:16);
  floatText(b,'−'+dmg,crit?'crit':'');
  anim(fo,[{filter:'brightness(3)',transform:'translateX(0)'},{filter:'brightness(1)',transform:'translateX(10px)'},{transform:'translateX(-6px)'},{transform:'none'}],{duration:380});
  $('stage').classList.remove('shake');void $('stage').offsetWidth;if(crit)$('stage').classList.add('shake');
  await wait(260);
}
async function enemyAttack(){
  const me=$('mesprite'),fo=$('foesprite'),a=sideAnchor('me'),b=sideAnchor('foe');
  await anim(fo,[{transform:'none'},{transform:'translateX(-22px) scale(1.08)'},{transform:'none'}],{duration:320});
  const ball=document.createElement('div');ball.className='inkball';$('fx').appendChild(ball);
  await anim(ball,[{transform:'translate('+(b.x-15)+'px,'+(b.y-15)+'px) scale(.5)'},{transform:'translate('+((a.x+b.x)/2-15)+'px,'+(a.y-70)+'px) scale(1.1)',offset:.5},{transform:'translate('+(a.x-15)+'px,'+(a.y-15)+'px) scale(1)'}],{duration:450,easing:'ease-in'});
  ball.remove();burst(a,['#121016','#3b3f6b','#5b5670'],18);floatText(a,'−'+foe.atk,'hurt');
  anim(me,[{filter:'brightness(.4) sepia(1) hue-rotate(-40deg) saturate(4)'},{filter:'none'}],{duration:450});
  for(const el of [$('stage'),$('tray')]){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
  if(!reduced){const sp=document.createElement('div');sp.className='splat';$('tray').style.position='relative';$('tray').appendChild(sp);sp.animate([{opacity:1},{opacity:1,offset:.6},{opacity:0}],{duration:1100}).onfinish=()=>sp.remove();}
  await wait(200);
}
async function foeDies(){
  const fo=$('foesprite'),b=sideAnchor('foe');
  burst(b,['#f3ecdc','#e9dfc9','#b9a888','#1b1a1f'],30);
  await anim(fo,[{transform:'none',opacity:1},{transform:'translateY(6px) rotate(-8deg) scale(1.05)',opacity:1,offset:.3},{transform:'translateY(30px) rotate(25deg) scale(.3)',opacity:0}],{duration:650,easing:'ease-in'});
  fo.style.opacity='0';
}

// ---------- game flow ----------
async function submit(){
  const w=wordOf(sel);if(busy||w.length<3||!DICT.has(w))return;
  busy=true;const pts=calc(sel),used=sel.slice();sel=[];
  const crit=used.some(x=>x.bonus),heal=used.reduce((a,x)=>a+x.heal,0);
  score+=pts;chapScore+=pts;moves++;
  const last=used[used.length-1];const p=document.createElement('div');p.className='pop';p.textContent='+'+pts;
  p.style.left=last.el.style.left;p.style.top=last.el.style.top;boardEl.appendChild(p);setTimeout(()=>p.remove(),1000);
  logWord(w,pts);
  for(const x of used){grid[x.c][x.r]=null;x.el.remove();}
  const reward=w.length>=7?3:w.length>=5?2:0;
  refill(reward,last.c,used.length<=3?0.18:0);
  updateWord();
  if(battle()){
    const dmg=dmgOf(pts);
    if(heal)php=Math.min(pmax,php+heal);
    await playerAttack(w,dmg,crit,heal);
    foe.hp=Math.max(0,foe.hp-dmg);updateUI();
    if(foe.hp<=0){await foeDies();busy=false;return foeDefeated();}
    await enemyTurn();busy=false;updateUI();checkOver();return;
  }
  tick();busy=false;updateUI();
  if(chapScore>=target())nextChapter();else checkOver();
}
async function enemyTurn(){
  foe.cd--;updateUI();
  if(foe.cd<=0){
    foe.cd=foe.every;await enemyAttack();php=Math.max(0,php-foe.atk);
    toast(t('foeHits',{n:foeName(),a:foe.atk}));updateUI();
  }
}
function foeDefeated(){
  const old=foeName()+' ('+foeSub()+')';chap++;php=Math.min(pmax,php+20);spawnFoe();updateUI();
  const st=foeStats(chap);
  showOver('Sieg!',t('winB',{o:esc(old),c:chap,n:esc(foeName()),h:st.hp,a:st.atk,e:st.every}),t('fight'),closeOver);
}
function refill(reward,rc,extraInk){
  for(let c=0;c<COLS;c++){
    const keep=grid[c].filter(Boolean);const miss=ROWS-keep.length;const col=[];
    for(let i=0;i<miss;i++){const x=mkTile();if(reward&&c===rc&&i===miss-1){x.bonus=reward;paint(x);reward=0;}else decorate(x);col.push(x);
      x.el.style.width=x.el.style.height=TS+'px';x.el.style.left=c*(TS+GAP)+'px';x.el.style.top=(-(miss-i)*(TS+GAP))+'px';}
    grid[c]=col.concat(keep);
  }
  void boardEl.offsetWidth;
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)place(grid[c][r],c,r);
  maybeInk(extraInk);ensurePlayable();
}
function maybeInk(extra){
  if(battle())return;
  let n=0;for(const col of grid)for(const x of col)if(x.ink)n++;
  const cap=1+Math.floor(chap/2),p=0.06+0.04*chap+extra;
  if(n<cap&&moves>1&&Math.random()<p){
    const cands=[];for(let c=0;c<COLS;c++)for(let r=0;r<2;r++){const x=grid[c][r];if(!x.ink&&!x.bonus)cands.push(x);}
    const x=cands[Math.random()*cands.length|0];if(x){x.ink=Math.max(4,9-chap);paint(x);}
  }
}
function tick(){
  let lost=0;
  for(const col of grid)for(const x of col)if(x.ink&&x.ink>0){x.ink--;if(x.ink<=0){lost++;x.ink=0;x.l=randLetter();x.el.animate([{filter:'brightness(3)'},{filter:'none'}],{duration:500});}paint(x);}
  if(lost){lives=Math.max(0,lives-lost);toast(t('inkLost',{n:lost}));}
}
async function shuffle(costsTurn){
  if(busy)return;busy=true;
  const all=[];for(const col of grid)for(const x of col)all.push(x);
  for(let i=all.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[all[i],all[j]]=[all[j],all[i]];}
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)grid[c][r]=all[c*ROWS+r];
  sel=[];layout();ensurePlayable();
  if(costsTurn){moves++;if(battle())await enemyTurn();else{tick();maybeInk(0);}}
  busy=false;updateUI();checkOver();
}
function ensurePlayable(){
  let tries=0;while(!findWord(3)&&tries<20){
    for(let k=0;k<4;k++){const x=grid[Math.random()*COLS|0][Math.random()*ROWS|0];if(!x.ink&&!x.bonus&&!x.heal){x.l=randLetter();paint(x);}}tries++;}
}
function nextChapter(){
  chap++;chapScore=0;lives=Math.min(3,lives+1);updateUI();
  showOver(t('chapT',{c:chap}),t('chapB',{p:chap-1}),t('go'),closeOver);
}
function checkOver(){
  if(battle()?php>0:lives>0)return;
  if(score>best){best=score;sset(bestKey(),best);}
  const top=found.slice().sort((a,b)=>b.pts-a.pts)[0];
  const where=battle()?t('reachedB',{c:chap,n:esc(foeName())}):t('reachedC',{c:chap});
  showOver(battle()?'Niederlage':'Ende',t('overB',{s:score,where,n:found.length})+(top?t('bestW',{w:top.w.toUpperCase(),p:top.pts}):''),t('again'),()=>pickMode(false));
}
function findWord(minLen){
  let bestP=null;const seen=new Set();
  function dfs(x,node,path){
    let n=node;for(const ch of x.l){n=n[ch];if(!n)return;}
    path.push(x);seen.add(x);
    const w=wordOf(path);
    if(n.$&&w.length>=3){if(!bestP||w.length>wordOf(bestP).length)bestP=path.slice();}
    if(path.length<8)for(let dc=-1;dc<=1;dc++)for(let dr=-1;dr<=1;dr++){const c=x.c+dc,r=x.r+dr;if(c<0||r<0||c>=COLS||r>=ROWS)continue;const u=grid[c][r];if(u&&!seen.has(u))dfs(u,n,path);}
    path.pop();seen.delete(x);
  }
  for(const col of grid)for(const x of col){if(x)dfs(x,TRIE,[]);if(bestP&&wordOf(bestP).length>=minLen)return bestP;}
  return bestP;
}

// ---------- dictionary panel ----------
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const nrm=s=>s.toLowerCase().replace(/ß/g,'ss');
let editing=null;
function trOf(w){
  const g=GLOSS[w],own=g&&g[LIDX[lang]];
  if(own)return{text:esc(own),user:false};
  const u=userTr[lang]&&userTr[lang][w];
  return u?{text:esc(u),user:true}:{text:'',user:false};
}
function display(w){
  const g=GLOSS[w];
  if(!g)return{de:esc(w.toUpperCase()),form:''};
  const de=g[0].split(' / ').map(x=>{const m=x.match(/^(der|die|das) (.+)$/);return m?'<span class="art">'+m[1]+'</span> '+esc(m[2]):esc(x);}).join(' / ');
  const lem=g[0].split(' / ')[0].split(' ').pop();
  return{de,form:nrm(lem)!==w?w.toUpperCase():''};
}
function trHTML(w,tr){return tr.text+(tr.user?' <span class="utr">('+t('fromPlayer')+')</span>':'');}
function wikt(w){return 'https://de.wiktionary.org/wiki/Spezial:Suche?search='+encodeURIComponent(w);}
function recentHTML(w){
  const d=display(w),tr=trOf(w);
  let h=(d.form?'<div class="form">'+esc(d.form)+' →</div>':'')+'<div class="de">'+d.de+'</div>';
  if(editing===w){
    const cur=(userTr[lang]&&userTr[lang][w])||'';
    h+='<form class="addtr" id="trform"><input id="trinput" maxlength="80" value="'+esc(cur)+'" placeholder="'+esc(t('trPh',{w:w.toUpperCase()}))+'" aria-label="'+esc(t('trPh',{w:w.toUpperCase()}))+'"><button class="save" type="submit">'+t('save')+'</button><button class="cancel" type="button" id="trcancel">'+t('cancel')+'</button></form>';
  } else if(tr.text){
    h+='<div class="th" lang="'+lang+'">'+trHTML(w,tr)+(tr.user?' <button class="lnk sm" id="tredit">'+t('edit')+'</button>':'')+'</div>';
  } else {
    h+='<div class="no">'+t('noTr')+' · <a href="'+wikt(w)+'" target="_blank" rel="noopener">Wiktionary</a></div><button class="lnk" id="tradd">'+t('addTr')+'</button>';
  }
  return h;
}
function liHTML(f){const d=display(f.w),tr=trOf(f.w);return '<span class="de">'+(d.form?'<span class="fm">'+esc(d.form)+' → </span>':'')+d.de+'</span><span class="p">+'+f.pts+'</span>'+(tr.text?'<span class="th" lang="'+lang+'">'+trHTML(f.w,tr)+'</span>':'');}
function renderDict(){
  const lb=$('lastbox');
  if(found.length){
    const w=found[found.length-1].w;lb.innerHTML=recentHTML(w);
    const add=$('tradd')||$('tredit');if(add)add.onclick=()=>{editing=w;renderDict();$('trinput').focus();};
    const f=$('trform');
    if(f){f.onsubmit=e=>{e.preventDefault();const v=$('trinput').value.trim();(userTr[lang]=userTr[lang]||{});if(v)userTr[lang][w]=v;else delete userTr[lang][w];sset('setzkasten-usertr',JSON.stringify(userTr));editing=null;renderDict();};
      $('trcancel').onclick=()=>{editing=null;renderDict();};}
  } else lb.innerHTML='<div class="empty">'+t('dictEmpty')+'</div>';
  $('log').innerHTML=found.slice().reverse().map(f=>'<li>'+liHTML(f)+'</li>').join('');
}
function logWord(w,pts){found.push({w,pts});editing=null;renderDict();}
let toastT;function toast(m){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2800);}
window.addEventListener('resize',()=>{if(grid)layout();});
$('mesprite').innerHTML=ME_SVG;
{const m=sget('setzkasten-mode','classic');if(m==='battle'||m==='classic')mode=m;}
newGame();pickMode(false);
})();
